name: Weekly dependency check

# Every Monday morning, checks the site's software packages against the public
# vulnerability database. If a serious one is found the run fails, which
# emails the repository owner, and an issue is opened with the details.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check packages for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high | tee audit.txt; exit ${PIPESTATUS[0]}
      - name: Open an issue if something serious is found
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Security update needed in:title" --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Security update needed" --body "$(printf 'The weekly check found a package with a known vulnerability. Running `npm audit fix` normally resolves it.\n\n```\n%s\n```' "$(tail -40 audit.txt)")"
          fi
